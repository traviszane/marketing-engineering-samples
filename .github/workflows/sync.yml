name: Sync Monorepo to Hugging Face Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Syncs Space
      - name: Sync Space
        run: |
          git subtree split --prefix=research-to-x-thread-generator -b space-branch
          git push https://creativecapy:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/creativecapy/research-to-x-thread-generator space-branch:main --force

      # 2. Syncs Model
      - name: Sync Model
        run: |
          git subtree split --prefix=Hype-to-Substance-AI-Paper-Auditor -b model-branch
          git push https://creativecapy:${{ secrets.HF_TOKEN }}@huggingface.co/creativecapy/Hype-to-Substance-AI-Paper-Auditor model-branch:main --force

      # 3. Syncs Dataset
      - name: Sync Dataset
        run: |
          git subtree split --prefix=GTA-Physics-vs-Reality-Depth-Bench -b dataset-branch
          git push https://creativecapy:${{ secrets.HF_TOKEN }}@huggingface.co/datasets/creativecapy/GTA-Physics-vs-Reality-Depth-Bench dataset-branch:main --force
