name: Sync Monorepo to Hugging Face Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Space
        run: |
          cd research-to-x-thread-generator
          git init
          git checkout -b main
          git add .
          git commit -m "Deploy Space from GitHub Actions"
          git push https://creativecapy:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/creativecapy/research-to-x-thread-generator main --force

      - name: Sync Model
        run: |
          cd Hype-to-Substance-AI-Paper-Auditor
          git init
          git checkout -b main
          git add .
          git commit -m "Deploy Model from GitHub Actions"
          git push https://creativecapy:${{ secrets.HF_TOKEN }}@huggingface.co/creativecapy/Hype-to-Substance-AI-Paper-Auditor main --force

      - name: Sync Dataset
        run: |
          cd GTA-Physics-vs-Reality-Depth-Bench
          git init
          git checkout -b main
          git add .
          git commit -m "Deploy Dataset from GitHub Actions"
          git push https://creativecapy:${{ secrets.HF_TOKEN }}@huggingface.co/datasets/creativecapy/GTA-Physics-vs-Reality-Depth-Bench main --force
