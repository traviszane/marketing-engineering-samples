name: Sync Monorepo to Hugging Face Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Space
        run: |
          git subtree split --prefix=research-to-x-thread-generator -b space-sync
          git push https://creativecapy:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/creativecapy/research-to-x-thread-generator space-sync:main --force

      - name: Sync Model
        run: |
          git subtree split --prefix=Hype-to-Substance-AI-Paper-Auditor -b model-sync
          git push https://creativecapy:${{ secrets.HF_TOKEN }}@huggingface.co/creativecapy/Hype-to-Substance-AI-Paper-Auditor model-sync:main --force

      - name: Sync Dataset
        run: |
          git subtree split --prefix=GTA-Physics-vs-Reality-Depth-Bench -b dataset-sync
          git push https://creativecapy:${{ secrets.HF_TOKEN }}@huggingface.co/datasets/creativecapy/GTA-Physics-vs-Reality-Depth-Bench dataset-sync:main --force
