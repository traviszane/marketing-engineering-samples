<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Paper & Model to X Thread Generator</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-inner: #1f2937;
      --accent: #38bdf8;
      --text: #f9fafb;
      --text-dim: #9ca3af;
      --border: #374151;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    h1 {
      color: var(--accent);
      margin-bottom: 0.25rem;
      font-size: 1.8rem;
    }
    p.subtitle {
      color: var(--text-dim);
      margin-top: 0;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .control-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    input, textarea, select {
      width: 100%;
      padding: 0.75rem;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.9rem;
      box-sizing: border-box;
      font-family: inherit;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    button {
      background: var(--accent);
      color: #090d16;
      font-weight: 700;
      border: none;
      padding: 0.85rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      width: 100%;
    }
    button:hover { opacity: 0.9; }
    .output-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
    }
    .tweet-box {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .tweet-header {
      font-weight: 700;
      color: var(--accent);
      font-size: 0.8rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧵 AI Research to X Thread Generator</h1>
    <p class="subtitle">GTM Engineering Tool: Converts raw AI paper abstracts, GitHub repos, or model specs into high-engagement tech viral threads.</p>

    <div class="control-panel">
      <div class="form-group">
        <label for="projectTitle">AI Project / Paper Name</label>
        <input type="text" id="projectTitle" value="FlashAttention-3: Ultra-Fast Attention for Long Context LLMs">
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="targetAudience">Target Audience</label>
          <select id="targetAudience">
            <option value="ml-eng">ML Engineers & Researchers</option>
            <option value="founders">AI Founders & Tech Execs</option>
            <option value="open-source">Open Source & Hugging Face Community</option>
          </select>
        </div>
        <div class="form-group">
          <label for="repoUrl">GitHub / Hugging Face Link</label>
          <input type="text" id="repoUrl" value="https://huggingface.co/models">
        </div>
      </div>

      <div class="form-group">
        <label for="techSummary">Core Breakthrough & Metrics</label>
        <textarea id="techSummary" rows="3">Introduces asynchronous tensor core execution and FP8 precision primitives, yielding 2.4x speedup over FlashAttention-2 on H100 GPUs while cutting memory overhead by 50%.</textarea>
      </div>

      <button onclick="generateThread()">🚀 Synthesize Viral X Thread</button>
    </div>

    <div class="output-card" id="threadOutput" style="display: none;">
      <h3 style="margin-top: 0; color: var(--accent);">Generated Thread Output</h3>
      <div id="tweetsContainer"></div>
    </div>
  </div>

  <script>
    function generateThread() {
      const title = document.getElementById('projectTitle').value;
      const link = document.getElementById('repoUrl').value;
      const summary = document.getElementById('techSummary').value;
      const container = document.getElementById('tweetsContainer');
      const outputCard = document.getElementById('threadOutput');
      
      container.innerHTML = "";
      outputCard.style.display = "block";

      const tweets = [
        `1/ We just dropped ${title} 🧠⚡\n\n${summary}\n\nHere is a breakdown of how it works and why it changes the game for production AI models 🧵👇`,
        `2/ The Core Problem 🛑\n\nStandard inference latency scales quadratically with context length. Existing optimizations trade off numerical precision or memory overhead.\n\n${title} fixes this bottleneck at the hardware level.`,
        `3/ Architectural Highlights 🛠️\n\n• Asynchronous memory pipelines\n• Optimized tensor core instruction scheduling\n• Zero-copy GPU memory access\n\nResult: 2-3x speedup with zero degradation in evaluation benchmarks.`,
        `4/ Try it out right now 🔥\n\nThe weights, benchmark suites, and implementation docs are fully open source:\n\n🔗 Demo & Repo: ${link}\n\nDrop your benchmark findings below!`
      ];

      tweets.forEach((tweetText, index) => {
        const div = document.createElement('div');
        div.className = 'tweet-box';
        div.innerHTML = `<div class="tweet-header">Post ${index + 1} of ${tweets.length}</div>${tweetText}`;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
